<text x="360" y="89"><tspan fill="#eaf4f7" font-weight="700">Добрый вечер! </tspan><tspan fill="#eaf4f7">Я Люмо.</tspan></text>
<text x="360" y="118"><tspan fill="#4df2c2" font-weight="700">Ai&gt;_ </tspan><tspan fill="#eaf4f7" font-weight="700">AI-llm-Engine</tspan></text>
<text x="360" y="147"><tspan fill="#7f8d95">Ваши модели, ваш Mac, без облака.</tspan></text>
<text x="360" y="205"><tspan fill="#39c6d6">Совет:</tspan><tspan fill="#eaf4f7"> ./llm perf — замерьте этот Mac</tspan></text>
<text x="360" y="234"><tspan fill="#eaf4f7">относительно шины памяти, которая его</tspan></text>
<text x="360" y="263"><tspan fill="#eaf4f7">ограничивает</tspan></text>
