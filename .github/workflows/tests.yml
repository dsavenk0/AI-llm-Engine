name: tests

# The engine is MLX on Apple Silicon, so the runner has to be one: macos-13 is Intel and MLX will not
# install there. macos-14 and later are M-series.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:                      # a new push supersedes the run still going for the same branch
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and app build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the engine needs 3.10+; the manager itself runs on 3.9+
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Engine environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: What we are testing against
        run: |
          .venv/bin/python -c "import mlx.core as mx, platform, sys; \
            print('python', sys.version.split()[0]); print('mlx', mx.__version__); \
            print(platform.platform(), platform.machine())"

      # No model is downloaded: the suite builds synthetic bundles (tests/synth.py) for the engine tests and
      # skips what genuinely needs a real checkpoint. Set ENGINE_TEST_MODEL to run those too.
      - name: Tests
        run: .venv/bin/python -m unittest discover -s tests

      # Compiles every Swift target — the menu-bar app, the editor, the voice chat, the OCR helper and the
      # widget — and signs ad hoc. build-dmg.sh is deliberately not run here: it styles the image through
      # AppleScript talking to Finder, which needs a desktop session a runner does not have.
      - name: Build the app
        run: ./build-app.sh

      - name: Size of what was built
        run: du -sh LLMBar.app
