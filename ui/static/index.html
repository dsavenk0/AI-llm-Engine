<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-llm-Engine — editor</title>
<style>
  :root { --bg:#0b0f14; --panel:#10161d; --line:#1d2733; --text:#d7e3ec; --dim:#7b8b99; --cyan:#27d3ff;
          --mint:#4df2c2; --yellow:#fff000; --pink:#ff3d8b; --code:#0d1218; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font:inherit; color:var(--text); background:#17212b; border:1px solid var(--line); border-radius:6px;
           padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--cyan); }
  button.warn { border-color:#7a6a00; color:var(--yellow); }
  button.mini { padding:0 6px; border:0; background:transparent; color:var(--dim); visibility:hidden; }
  .node:hover button.mini { visibility:visible; }
  #app { display:grid; grid-template-rows:38px 1fr 22px; grid-template-columns:240px 1fr 380px; height:100vh; }
  header { grid-column:1/4; display:flex; align-items:center; gap:14px; padding:0 12px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header b { color:var(--cyan); letter-spacing:.4px; }
  #engine.ok { color:var(--mint); } #engine.off { color:var(--pink); }
  #branch { color:var(--dim); margin-left:auto; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .seg { display:flex; border-bottom:1px solid var(--line); }
  .seg button { flex:1; border:0; border-radius:0; background:transparent; padding:7px; color:var(--dim); }
  .seg button.on { color:var(--text); box-shadow:inset 0 -2px var(--cyan); }
  #tree, #git { overflow:auto; flex:1; padding:4px 0; }
  #git { display:none; padding:8px; }
  .node { padding:2px 8px; cursor:pointer; white-space:nowrap; display:flex; justify-content:space-between; }
  .node:hover { background:#16202a; } .node.active { background:#12303a; color:var(--cyan); }
  .gf { display:flex; gap:8px; align-items:center; padding:2px 0; }
  .gf a { color:var(--text); cursor:pointer; text-decoration:underline dotted; overflow:hidden; text-overflow:ellipsis; }
  .gs { width:16px; text-align:center; font-weight:700; } .gs-modified{color:var(--yellow)} .gs-added,.gs-untracked{color:var(--mint)}
  .gs-deleted{color:var(--pink)}
  #cmsg { width:100%; margin:8px 0; background:var(--code); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px; }
  .row { display:flex; gap:8px; }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #tabs { display:flex; background:var(--panel); border-bottom:1px solid var(--line); overflow:auto; min-height:30px; }
  .tab { padding:6px 12px; border-right:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap; }
  .tab.active { color:var(--text); background:var(--bg); box-shadow:inset 0 2px var(--cyan); }
  .x { margin-left:8px; color:var(--dim); cursor:pointer; } .x:hover { color:var(--pink); }
  #editor { position:relative; flex:1; min-height:0; background:var(--code); display:flex; }
  #gutter, #hl, #ta { font:12.5px/18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin:0; padding:10px 0; tab-size:4; }
  #gutter { width:46px; text-align:right; padding-right:10px; color:#4a5866; overflow:hidden; user-select:none;
            border-right:1px solid var(--line); white-space:pre; }
  #wrap { position:relative; flex:1; min-width:0; }
  #hl, #ta { position:absolute; inset:0; padding-left:12px; padding-right:12px; white-space:pre; overflow:auto; border:0; outline:0;
             width:100%; height:100%; background:transparent; }
  #hl { color:var(--text); pointer-events:none; }
  #ta { color:transparent; caret-color:var(--cyan); resize:none; }
  #ta::selection { background:#27d3ff44; }
  #empty-editor { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .t-keyword{color:#ff7ab6} .t-string{color:#9be37a} .t-comment{color:#5d7183;font-style:italic} .t-number{color:#ffb86c}
  .t-function{color:#27d3ff} .t-type{color:#4df2c2} .t-decorator{color:#c792ea} .t-property{color:#82aaff}
  .t-constant{color:#f78c6c} .t-tag{color:#ff7ab6} .t-heading{color:#4df2c2;font-weight:700}
  #status { grid-column:1/4; display:flex; gap:16px; padding:0 12px; align-items:center; background:var(--panel);
            border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
  #right { display:flex; flex-direction:column; min-height:0; background:var(--panel); border-left:1px solid var(--line); }
  #outline { height:34%; overflow:auto; border-bottom:1px solid var(--line); padding:4px 0; }
  .sym { padding:2px 8px; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .sym:hover { background:#16202a; } .sym .ln { margin-left:auto; color:var(--dim); font-size:11px; }
  .k { font-size:9px; text-transform:uppercase; padding:0 4px; border-radius:3px; background:#1a2530; color:var(--dim); }
  .k-class,.k-struct,.k-type,.k-interface{color:var(--mint)} .k-function,.k-method{color:var(--cyan)} .k-heading{color:var(--yellow)}
  .empty { color:var(--dim); padding:10px; }
  #chat { flex:1; display:flex; flex-direction:column; min-height:0; }
  #messages { flex:1; overflow:auto; padding:8px; }
  .msg { margin:6px 0; padding:8px 10px; border-radius:8px; background:#141c25; overflow-wrap:anywhere; }
  .msg.user { background:#12303a; } .msg p { margin:.3em 0; } .msg code { background:#0b1117; padding:0 4px; border-radius:3px; }
  .att { margin-top:4px; color:var(--dim); font-size:11px; }
  .code { margin:6px 0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--code); }
  .code-head { display:flex; justify-content:space-between; padding:3px 8px; background:#131b24; color:var(--dim); font-size:11px; }
  .code-head button { padding:0 6px; margin-left:4px; font-size:11px; }
  .code pre { margin:0; padding:8px; overflow:auto; font:12px/1.4 ui-monospace, Menlo, monospace; }
  details { color:var(--dim); } .rs { white-space:pre-wrap; font-size:12px; }
  #composer { border-top:1px solid var(--line); padding:8px; }
  #chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .chip { background:#12303a; border-radius:10px; padding:1px 8px; font-size:11px; }
  #prompt { width:100%; height:70px; background:var(--code); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px; resize:vertical; }
  .tools { display:flex; gap:8px; align-items:center; margin-top:6px; color:var(--dim); }
  .tools .grow { flex:1; }
  #send { background:#12303a; border-color:var(--cyan); }
  #modal { display:none; position:fixed; inset:0; background:#000a; align-items:center; justify-content:center; z-index:10; }
  #modal.open { display:flex; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; width:min(760px, 92vw); max-height:84vh; display:flex; flex-direction:column; }
  .box h3 { margin:0 0 8px; } .mbody { overflow:auto; } .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .diff { font:12px/1.4 ui-monospace, Menlo, monospace; background:var(--code); border-radius:6px; padding:6px; overflow:auto; max-height:52vh; }
  .dl { white-space:pre; } .dl.add { background:#12361f; color:#9be37a; } .dl.del { background:#3b1420; color:#ff8fb1; }
  #toast { position:fixed; right:16px; bottom:34px; background:#12303a; border:1px solid var(--cyan); padding:8px 12px; border-radius:8px;
           opacity:0; transition:opacity .2s; pointer-events:none; max-width:420px; z-index:20; }
  #toast.show { opacity:1; } #toast.bad { background:#3b1420; border-color:var(--pink); }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>AI-llm-Engine</b><span id="project"></span><span id="engine" class="off">…</span>
    <button id="save">Save ⌘S</button><span id="branch"></span>
  </header>
  <aside>
    <div class="seg"><button data-pane="files" class="on">Files</button><button data-pane="git">Changes</button></div>
    <div id="tree"></div><div id="git"></div>
  </aside>
  <main>
    <div id="tabs"></div>
    <div id="editor"><div id="gutter"></div>
      <div id="wrap"><pre id="hl"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <div id="empty-editor">Pick a file on the left</div></div></div>
  </main>
  <div id="right">
    <div id="outline"></div>
    <div id="chat">
      <div id="messages"></div>
      <div id="composer">
        <div id="chips"></div>
        <textarea id="prompt" placeholder="Ask about the project… (⌘↵ to send)"></textarea>
        <div class="tools">
          <button id="attach-current" title="Attach the open file">📎 Attach file</button>
          <label><input type="checkbox" id="think"> reasoning</label><span class="grow"></span>
          <button id="clear">Clear</button><button id="send">Send</button>
        </div>
      </div>
    </div>
  </div>
  <div id="status"><span id="status-file"></span></div>
</div>
<div id="modal"></div><div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
